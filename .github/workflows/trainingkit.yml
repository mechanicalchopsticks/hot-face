name: TrainingKit

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - name: Lint Swift sources
        run: git ls-files -z -- '*.swift' | xargs -0 xcrun swift-format lint --strict
      - name: Run TrainingKit tests
        run: swift test --package-path TrainingKit
